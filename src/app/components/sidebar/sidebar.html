<!-- Overlay para cerrar el sidebar en móvil -->
<div
  class="sidebar-overlay"
  [class.active]="sidebarOpen"
  (click)="closeSidebar()"
></div>

<!-- Botón para abrir el sidebar en móvil -->
<button
  class="sidebar-fab"
  (click)="toggleSidebar()"
  [class.hidden-fab]="sidebarOpen"
  aria-label="Abrir menú"
>
  <app-icon name="menu" [size]="20"></app-icon>
</button>

<!-- Sidebar principal -->
<div class="sidebar-panel" [class.open]="sidebarOpen">

  <!-- Botón cerrar (móvil) -->
  <button class="sidebar-close" (click)="closeSidebar()" aria-label="Cerrar menú">
    <app-icon name="x" [size]="18"></app-icon>
  </button>

  <!-- LOGO -->
  <div class="sidebar-logo">
    <div class="sidebar-logo__box">Q</div>
    <div>
      <h1 class="sidebar-logo__title">QoS Analytics</h1>
      <p class="sidebar-logo__sub">Intelligent Monitoring</p>
    </div>
  </div>

  <!-- MENU -->
  <nav class="sidebar-nav">

    @for (item of tabItems; track item.tab) {
      <button
        type="button"
        class="sidebar-nav__item"
        [class.active]="activeTab === item.tab"
        (click)="selectTab(item.tab)"
      >
        <app-icon [name]="item.icon" [size]="18" class="sidebar-nav__icon"></app-icon>
        <span>{{ item.label }}</span>
      </button>
    }

    <a
      routerLink="/historial"
      routerLinkActive="active"
      class="sidebar-nav__item"
      (click)="closeSidebar()"
    >
      <app-icon name="archive" [size]="18" class="sidebar-nav__icon"></app-icon>
      <span>Historial</span>
    </a>

  </nav>

  <!-- STATUS -->
  <div class="sidebar-status">
    <div class="sidebar-status__info">
      <p class="sidebar-status__label">Estado del sistema</p>
      <h1 class="sidebar-status__value">ONLINE</h1>
    </div>
    <div class="sidebar-status__dot"></div>
  </div>

</div>
