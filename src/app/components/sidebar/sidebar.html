<!-- Overlay para cerrar el sidebar en móvil -->
<div
  class="sidebar-overlay"
  [class.active]="sidebarOpen"
  (click)="closeSidebar()"
></div>

<!-- Botón para abrir el sidebar en móvil -->
<button
  class="sidebar-fab"
  (click)="toggleSidebar()"
  [class.hidden-fab]="sidebarOpen"
  aria-label="Abrir menú"
>
  ☰
</button>

<!-- Sidebar principal -->
<div class="sidebar-panel" [class.open]="sidebarOpen">

  <!-- Botón cerrar (móvil) -->
  <button class="sidebar-close" (click)="closeSidebar()" aria-label="Cerrar menú">✕</button>

  <!-- LOGO -->
  <div class="sidebar-logo">
    <div class="sidebar-logo__box">Q</div>
    <div>
      <h1 class="sidebar-logo__title">QoS Analytics</h1>
      <p class="sidebar-logo__sub">Intelligent Monitoring</p>
    </div>
  </div>

  <!-- MENU -->
  <nav class="sidebar-nav">

    <div class="sidebar-nav__item active">
      <span class="sidebar-nav__icon">📊</span>
      <span>Dashboard</span>
    </div>

    <div class="sidebar-nav__item">
      <span class="sidebar-nav__icon">📈</span>
      <span>Estadísticas</span>
    </div>

    <div class="sidebar-nav__item">
      <span class="sidebar-nav__icon">🌐</span>
      <span>Tráfico de Red</span>
    </div>

    <div class="sidebar-nav__item">
      <span class="sidebar-nav__icon">⚡</span>
      <span>Simulación M/M/1</span>
    </div>

    <div class="sidebar-nav__item">
      <span class="sidebar-nav__icon">📑</span>
      <span>Reportes</span>
    </div>

  </nav>

  <!-- STATUS -->
  <div class="sidebar-status">
    <div class="sidebar-status__info">
      <p class="sidebar-status__label">Estado del sistema</p>
      <h1 class="sidebar-status__value">ONLINE</h1>
    </div>
    <div class="sidebar-status__dot"></div>
  </div>

</div>
