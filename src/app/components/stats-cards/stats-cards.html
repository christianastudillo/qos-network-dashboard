<div class="stats-grid">
  @for (metric of metrics; track metric.title) {
    <div class="glass rounded-3xl card-hover stat-card">
      <div class="stat-card__decoration"></div>

      <div class="flex justify-between items-start stat-card__content">
        <div>
          <p class="metric-lbl">{{ metric.title }}</p>
          <p class="metric-val">{{ metric.value }}</p>
        </div>
        <div class="icon-bg">
          <app-icon [name]="metric.icon" [size]="26"></app-icon>
        </div>
      </div>
    </div>
  }
</div>
