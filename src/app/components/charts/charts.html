<div class="glass p-10 rounded-3xl h-full">

    <div class="flex justify-between items-center mb-10">

        <div>

            <h1 class="text-4xl font-black">
                Traffic Analytics
            </h1>

            <p class="text-gray-400 mt-2">
                Monitoreo estadístico del tráfico QoS
            </p>

        </div>

        <div class="flex gap-4">

            <button class="bg-cyan-500 px-5 py-2 rounded-xl">
                Día
            </button>

            <button class="glass px-5 py-2 rounded-xl">
                Semana
            </button>

            <button class="glass px-5 py-2 rounded-xl">
                Mes
            </button>

        </div>

    </div>

    <canvas
        baseChart
        [data]="lineChartData"
        [options]="lineChartOptions"
        [type]="'line'">
    </canvas>

</div>
