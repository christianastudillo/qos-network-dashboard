<nav class="qos-navbar">

  <!-- Título de la sección activa (la navegación real vive en el sidebar) -->
  <div class="qos-navbar__title">
    <h2>{{ sectionTitle }}</h2>
  </div>

  <!-- Menú de usuario -->
  <div class="qos-navbar__user">
    @if (userEmail) {
      <div class="qos-navbar__user-chip">
        <app-icon name="user" [size]="16"></app-icon>
        <span>{{ userEmail }}</span>
      </div>
      <button
        type="button"
        class="qos-navbar__logout"
        (click)="logout.emit()"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <app-icon name="log-out" [size]="18"></app-icon>
      </button>
    }
  </div>

</nav>
