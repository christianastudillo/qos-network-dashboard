<div class="auth-shell">
  <div class="auth-card card">
    <div class="auth-logo">
      <div class="auth-logo__box">Q</div>
      <div>
        <h1 class="auth-logo__title">QoS Analytics</h1>
        <p class="auth-logo__sub">Intelligent Network Monitoring</p>
      </div>
    </div>

    <h2 class="title-section mb-1">Crear cuenta</h2>
    <p class="subtitle mb-6">Regístrate para guardar y consultar tu historial de análisis.</p>

    @if (errorMessage()) {
      <div class="form-alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          class="input"
          autocomplete="email"
          placeholder="tucorreo@ejemplo.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="input"
          autocomplete="new-password"
          placeholder="Mínimo 6 caracteres"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
        />
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input
          id="confirmPassword"
          type="password"
          class="input"
          autocomplete="new-password"
          placeholder="Repite tu contraseña"
          [ngModel]="confirmPassword()"
          (ngModelChange)="confirmPassword.set($event)"
          name="confirmPassword"
          required
        />
      </div>

      <button type="submit" class="btn-primary w-full mt-2" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
