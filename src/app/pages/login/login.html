<div class="auth-shell">
  <div class="auth-card card">
    <div class="auth-logo">
      <div class="auth-logo__box">Q</div>

      <div>
        <h1 class="auth-logo__title">QoS Analytics</h1>
        <p class="auth-logo__sub">Intelligent Network Monitoring</p>
      </div>
    </div>

    <h2 class="title-section mb-1">Iniciar sesión</h2>

    <p class="subtitle mb-6">
      Ingresa con tu cuenta para ver tus análisis guardados.
    </p>

    @if (errorMessage()) {
      <div class="form-alert">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-field">
        <label for="email">Correo electrónico</label>

        <input
          id="email"
          type="email"
          class="input"
          autocomplete="email"
          placeholder="tucorreo@ejemplo.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
        />
      </div>

      <div class="form-field">
        <label for="password">Contraseña</label>

        <input
          id="password"
          type="password"
          class="input"
          autocomplete="current-password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
        />
      </div>

      <button
        type="submit"
        class="btn-primary w-full mt-2"
        [disabled]="isSubmitting() || isGoogleSubmitting()"
      >
        {{ isSubmitting() ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <div class="auth-divider" aria-hidden="true">
      <span>o</span>
    </div>

    <button
      type="button"
      class="btn-secondary btn-google w-full"
      (click)="onGoogleLogin()"
      [disabled]="isSubmitting() || isGoogleSubmitting()"
    >
      <svg
        class="btn-google__icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          fill="#4285F4"
          d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.54h3.24c1.9-1.75 2.98-4.33 2.98-7.41z"
        />

        <path
          fill="#34A853"
          d="M12 22c2.7 0 4.97-.9 6.63-2.43l-3.24-2.54c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.62A10 10 0 0 0 12 22z"
        />

        <path
          fill="#FBBC05"
          d="M6.39 13.86A6 6 0 0 1 6.08 12c0-.65.11-1.28.31-1.86V7.52H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.48l3.35-2.62z"
        />

        <path
          fill="#EA4335"
          d="M12 6.01c1.47 0 2.79.51 3.83 1.5l2.87-2.88A9.6 9.6 0 0 0 12 2 10 10 0 0 0 3.04 7.52l3.35 2.62C7.18 7.77 9.39 6.01 12 6.01z"
        />
      </svg>

      <span>
        {{
          isGoogleSubmitting()
            ? 'Conectando con Google...'
            : 'Continuar con Google'
        }}
      </span>
    </button>

    <p class="auth-footer">
      ¿No tienes cuenta?
      <a routerLink="/registro">Crea una aquí</a>
    </p>
  </div>
</div>
